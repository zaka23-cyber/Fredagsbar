services:
  api:
    build: .
    command: python api.py
    ports:
      - "5001:5001"

  frontend:
    build: .
    command: >
      streamlit run app.py
      --server.address=0.0.0.0
      --server.port=8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:5001
    depends_on:
      - api